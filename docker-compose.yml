version: '3.8'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: si_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    networks:
      - si_network
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: si_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - si_network
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: si_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: si_inventaris
      POSTGRES_USER: si_user
      POSTGRES_PASSWORD: si_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - si_network

  frontend:
    image: node:20-alpine
    container_name: si_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - si_network

networks:
  si_network:
    driver: bridge

volumes:
  postgres_data: